name = "howdy_database"
version = "0.1.0"
description = "Package-owned migrations and portable transactions over Gloo for Howdy apps"
licences = ["Apache-2.0"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
howdy = { path = ".." }
gloo = ">= 1.0.2 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
