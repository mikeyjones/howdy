name = "howdy_dev"
version = "0.1.0"
description = "Hot reload for howdy apps in development"
licences = ["Apache-2.0"]
target = "erlang"

[erlang]
extra_applications = ["crypto"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
ewe = ">= 7.0.0 and < 8.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
howdy = { path = ".." }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
