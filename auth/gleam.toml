name = "howdy_auth"
version = "0.1.0"
description = "Optional authentication and role-based authorization for Howdy"
licences = ["Apache-2.0"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
ewe = ">= 7.0.0 and < 8.0.0"
howdy = { path = ".." }
gloo = ">= 1.0.2 and < 2.0.0"
jargon = { path = "vendor/jargon" }
argus = ">= 2.0.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
