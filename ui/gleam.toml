name = "howdy_ui"
version = "0.1.0"
description = "Pages, themes and live server components for howdy, built on Lustre and Sketch"
licences = ["Apache-2.0"]
target = "erlang"

[erlang]
application_start_module = "howdy_ui_app"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
argv = ">= 1.0.0 and < 2.0.0"
ewe = ">= 7.0.0 and < 8.0.0"
howdy = { path = ".." }
lustre = ">= 5.7.0 and < 6.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
sketch = ">= 4.2.0 and < 5.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
